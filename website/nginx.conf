# Static company site. Runs unprivileged on port 8080 inside the container; TLS is terminated by the reverse proxy in front.
# (Installed as conf.d/default.conf, so the top-level lines below are in nginx's http context.)
server_tokens off;
gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/css text/plain image/svg+xml application/javascript application/json;

server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx drops server-level add_header lines in any location that sets its own, so the security headers live in one
  # snippet that every location includes.
  location = /healthz { access_log off; default_type text/plain; add_header Cache-Control "no-store"; return 200 "ok\n"; }
  location ~* \.(css|svg|ico|png|jpg|webp)$ { expires 7d; add_header Cache-Control "public"; include /etc/nginx/security-headers.conf; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; include /etc/nginx/security-headers.conf; try_files $uri $uri/ =404; }
}
