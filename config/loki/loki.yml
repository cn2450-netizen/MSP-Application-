# Single-binary Loki with multi-tenancy ON. The tenant is taken from the
# X-Scope-OrgID header, which only the gateway sets (from the agent's credential).
# Loki is on the internal network and is never exposed directly.
auth_enabled: true

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 744h          # 31 days default; override per tenant later
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_streams_per_user: 5000
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
