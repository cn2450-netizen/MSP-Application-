# Ingest gateway. Public surface for agents; everything else is 404.
#  - Loki push: Bearer key -> tenant (generated/gateway/loki.map). The tenant header
#    is always set here, so a client-supplied X-Scope-OrgID can never be used.
#  - Influx write: passed through; Influx enforces its own bucket-scoped write tokens.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server_tokens off;

  # Never log credentials: $http_authorization is deliberately absent.
  log_format ingest '$remote_addr "$request_method $uri" $status $request_length $request_time tenant=$loki_tenant';
  access_log /dev/stdout ingest;

  # Behind NPM: trust X-Forwarded-For from private ranges only.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;

  map $http_authorization $loki_tenant {
    default "";
    include /etc/nginx/tenants/loki.map;   # lines: "Bearer <key>" "<tenant>";
  }

  limit_req_zone $binary_remote_addr zone=ingest:10m rate=50r/s;

  server {
    listen 8080;
    client_max_body_size 5m;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    location = /loki/api/v1/push {
      limit_req zone=ingest burst=100 nodelay;
      if ($request_method != POST) { return 405; }
      if ($loki_tenant = "")       { return 401; }
      proxy_set_header X-Scope-OrgID $loki_tenant;
      proxy_set_header Authorization "";
      proxy_pass http://loki:3100/loki/api/v1/push;
    }

    location = /influx/api/v2/write {
      limit_req zone=ingest burst=100 nodelay;
      if ($request_method != POST) { return 405; }
      proxy_pass http://influxdb:8086/api/v2/write;
    }

    location = /influx/ping {
      proxy_pass http://influxdb:8086/ping;
    }

    location / { return 404; }
  }
}
